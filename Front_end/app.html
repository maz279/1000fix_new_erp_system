<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1"/>
<title>1000 FiX ERP — Workspace</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'><rect width='32' height='32' rx='7' fill='%230E7A6E'/><text x='16' y='22' font-size='15' font-weight='800' fill='white' text-anchor='middle' font-family='Arial'>F</text></svg>"/>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Noto+Sans+Bengali:wght@400;600&family=JetBrains+Mono:wght@400&display=swap" rel="stylesheet"/>
<link rel="stylesheet" href="css/tokens.css?v=2"/>
<link rel="stylesheet" href="css/app.css?v=2"/>
<style>
#fx-shell { display: grid; height: 100vh; }
</style>
</head>
<body>
<div id="fx-shell" aria-label="1000 FiX ERP application shell">
  <div style="grid-column:1/-1;display:flex;align-items:center;justify-content:center;gap:12px;height:100vh;color:var(--ink-500)">
    <span class="skeleton" style="width:180px;height:14px"></span> loading shell…
  </div>
</div>
<div id="fx-modal" class="fx-modal-root"></div>
<script src="js/nav_data.js?v=2"></script>
<script src="js/nav_data2.js?v=2"></script>
<script src="js/nav_data3.js?v=2"></script>
<script src="js/demo_data.js?v=2"></script>
<script src="js/i18n.js?v=2"></script>
<script src="js/charts.js?v=2"></script>
<script src="js/shell.js?v=2"></script>
<script src="js/app.js?v=2"></script>
<script>
(function () {
  window.FXRenderShell(document.getElementById('fx-shell'));
  window.FXRoute();
  /* session restore from Tab Rail persistence */
  try {
    var sess = JSON.parse(localStorage.getItem('fx-session') || '[]');
    sess.slice(0, 12).forEach(function (x) { window.FXOpenTab(x.id, x.title, x.route, x.icon); });
  } catch (e) {}
  if (!location.hash) location.hash = '#/home';
})();
</script>
</body>
</html>

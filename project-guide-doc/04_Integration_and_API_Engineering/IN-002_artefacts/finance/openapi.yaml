# 1000FiX ERP — Finance Context API
# Bounded context 8 of 11 (IN-002 §3.1). Owning modules M19, M20, M49–M54.
#
# This exemplar covers the MONEY PATH, because it concentrates the obligations no
# generic pattern covers:
#   · Money as string decimal, never float (AS-10)
#   · the 7-day idempotency window on money-moving operations (IN-001 ID-08)
#   · /api/v1/payments/confirm — one of the TWELVE CON-03 endpoints that NO MODULE
#     DECLARES (IN-001 §9.2), and the one on the money path
#   · PT-05 read-back: an inbound payment notification is a HINT, never authority
#   · 451 data.residency_restricted
#   · x-export and the bulk class
#   · the two-number latency budget (IN-001-D-03)
#
# CONFIDENTIAL — Internal Use Only

openapi: 3.1.0

info:
  title: 1000FiX Finance API
  version: 1.0.0
  description: |
    Invoices, payments, receivables and the export surface — the `finance` bounded context
    (`AR-008` §5).

    **Category G is terminal in the dependency graph** (`AR-001` `LB-04`): financial
    postings originate only here. Other contexts raise *billable events*; they never write
    journal entries. No operation in any other contract creates a ledger movement.

    **Latency is published as two numbers** (`IN-001-D-03`). `NFR-042`'s *"payment
    confirmation round trip ≤ 3 s p95"* is unachievable end-to-end against a rail whose own
    integration guide instructs merchants to set a **30-second** client timeout. It is
    restated as an internal-processing budget, with a separate per-rail end-to-end
    expectation carried in `IN-004`. `AUDIT-016` `AP-06` records the unreconciled position.
  contact:
    name: Integration Architect, 1000FiX Services Limited
    email: integration-architecture@1000fix.example
  license:
    name: CONFIDENTIAL — Internal Use Only

servers:
  - url: https://sandbox.api.1000fix.example
    description: Partner sandbox. Holds NO real personal data — a stricter bar than NFR-071 masking.

externalDocs:
  description: Payment integration runbook content
  url: https://developer.1000fix.example/payments

tags:
  - name: invoices
    x-family: corporate
    x-owning-module: M20
  - name: payments
    x-family: customer
    x-owning-module: M20

security:
  - oauthMachine: []

paths:

  /api/v1/invoices:
    get:
      operationId: listInvoices
      summary: List invoices within the caller's data scope
      tags: [invoices]
      x-scope: ['invoice:read:own_org']
      x-scope-status: proposed
      x-owning-module: M20
      x-endpoint-class: standard-read
      x-rate-limit-class: partner-standard
      x-wave: W3
      x-disclosure-ref: 'AP-012 §4.5 — corporate client counterparty register'
      parameters:
        - $ref: '../_shared/components.yaml#/components/parameters/CursorParam'
        - $ref: '../_shared/components.yaml#/components/parameters/LimitParam'
        - $ref: '../_shared/components.yaml#/components/parameters/SortParam'
        - $ref: '../_shared/components.yaml#/components/parameters/FieldsParam'
        - name: filter[state]
          in: query
          schema: { type: string, enum: [draft, issued, part_paid, paid, overdue, disputed, credited, void] }
        - name: filter[issued_after]
          in: query
          schema: { type: string, format: date }
      responses:
        '200':
          description: A page of invoices.
          headers:
            X-Correlation-Id: { $ref: '../_shared/components.yaml#/components/headers/XCorrelationId' }
          content:
            application/json:
              schema:
                type: object
                required: [data, page]
                properties:
                  data: { type: array, items: { $ref: '#/components/schemas/Invoice' } }
                  page: { $ref: '../_shared/components.yaml#/components/schemas/PageInfo' }
        '400': { $ref: '../_shared/errors.yaml#/components/responses/BadRequest' }
        '401': { $ref: '../_shared/errors.yaml#/components/responses/Unauthorized' }
        '403': { $ref: '../_shared/errors.yaml#/components/responses/Forbidden' }
        '429': { $ref: '../_shared/errors.yaml#/components/responses/TooManyRequests' }

  /api/v1/invoices/{invoice_id}:
    parameters:
      - name: invoice_id
        in: path
        required: true
        schema: { type: string, pattern: '^INV-[0-9]{4}-[0-9]{6,10}$' }
    get:
      operationId: getInvoice
      summary: Retrieve one invoice
      tags: [invoices]
      x-scope: ['invoice:read:own_org']
      x-scope-status: proposed
      x-owning-module: M20
      x-endpoint-class: standard-read
      x-rate-limit-class: partner-standard
      x-wave: W3
      responses:
        '200':
          description: The invoice.
          headers:
            ETag: { $ref: '../_shared/components.yaml#/components/headers/ETag' }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Invoice' }
        '401': { $ref: '../_shared/errors.yaml#/components/responses/Unauthorized' }
        '403': { $ref: '../_shared/errors.yaml#/components/responses/Forbidden' }
        '451': { $ref: '../_shared/errors.yaml#/components/responses/UnavailableForLegalReasons' }

  /api/v1/invoices/export:
    get:
      operationId: exportInvoices
      summary: Export invoices asynchronously
      tags: [invoices]
      x-scope: ['invoice:export:own_org']
      x-scope-status: proposed
      x-owning-module: M20
      x-endpoint-class: analytics
      x-rate-limit-class: bulk
      x-export: true
      x-wave: W3
      description: |
        **`export` is a separate scope from `read`** (`AP-005` `SC-06`) and is
        rate-controlled and logged. Bulk personal-data export additionally requires
        approval and step-up (`EA-12`, `FR-SEC-041`) — a human requests it; it cannot be
        automated, and a machine credential receives `403 auth.step_up_required`.

        Returns `202` with a `job_url`. `export.result_too_large` on the synchronous route
        names this endpoint in `details.async_endpoint`.
      parameters:
        - name: format
          in: query
          required: true
          schema: { type: string, enum: [csv, xlsx, json] }
        - name: filter[issued_after]
          in: query
          schema: { type: string, format: date }
      responses:
        '202':
          description: Accepted.
          content:
            application/json:
              schema: { $ref: '../_shared/components.yaml#/components/schemas/AsyncJobAccepted' }
        '401': { $ref: '../_shared/errors.yaml#/components/responses/Unauthorized' }
        '403':
          description: |
            Includes `auth.export_not_permitted`, `export.approval_required` and
            `data.minimisation_refused` — the last where the request asked for more fields
            than the counterparty's purpose requires (`IP-10`).
          content:
            application/problem+json:
              schema: { $ref: '../_shared/errors.yaml#/components/schemas/Problem' }
          x-retry-safe: false
        '429':
          description: "`export.rate_limited` — export limits are separate from the interactive limit."
          content:
            application/problem+json:
              schema: { $ref: '../_shared/errors.yaml#/components/schemas/Problem' }
          headers:
            Retry-After: { $ref: '../_shared/components.yaml#/components/headers/RetryAfter' }
          x-retry-safe: true
        '451': { $ref: '../_shared/errors.yaml#/components/responses/UnavailableForLegalReasons' }

  /api/v1/payments:
    post:
      operationId: initiatePayment
      summary: Initiate a payment against an invoice
      tags: [payments]
      x-scope: ['payment:write']
      x-scope-status: proposed
      x-owning-module: M20
      x-endpoint-class: write
      x-rate-limit-class: partner-high
      x-wave: W3
      x-retry-safe: false
      x-idempotency-retention: P7D
      description: |
        **Idempotency retention on this operation is 7 days, not 24 hours**
        (`IN-001` `ID-08`). `idempotency.key_expired` instructs the caller to *"treat the
        outcome as unknown and reconcile before resubmitting. **Never blind-resubmit a
        payment or a payout.**"* A 24-hour window means a partner whose integration was
        down over a weekend cannot safely retry, leaving human reconciliation against the
        gateway as the only option. Storage cost is trivial; a double payment is not.

        **Latency, two numbers** (`IN-001-D-03`):

        | Budget | Target |
        |---|---|
        | Internal processing, excluding the rail | ≤ 3 s p95 (`write` class) |
        | End-to-end including the rail | Per rail, published in `IN-004` §4–§6 |

        The rail is **not** called inside a database transaction (`PT-02`), and never on
        the critical path of a state transition (`PT-03`).
      parameters:
        - $ref: '../_shared/components.yaml#/components/parameters/IdempotencyKeyParam'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [invoice_id, amount, rail]
              properties:
                invoice_id: { type: string }
                amount: { $ref: '../_shared/components.yaml#/components/schemas/Money' }
                rail:
                  type: string
                  enum: [bkash, nagad, sslcommerz_card, sslcommerz_netbanking, rocket, cash, bank_transfer]
                  description: >
                    `INT-001` bKash · `INT-002` Nagad · `INT-003` SSLCOMMERZ ·
                    `INT-004` Rocket. `INT-003` is the ONLY card acquirer in the catalogue,
                    so the card path has no failover (`IN-001` `FB-05`, `AUDIT-016` `AP-06`).
                return_url: { type: [string, "null"], format: uri }
      responses:
        '201':
          description: Payment initiated; a redirect or token is returned for the customer to complete.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/PaymentInitiation' }
        '400': { $ref: '../_shared/errors.yaml#/components/responses/BadRequest' }
        '401': { $ref: '../_shared/errors.yaml#/components/responses/Unauthorized' }
        '403': { $ref: '../_shared/errors.yaml#/components/responses/Forbidden' }
        '409': { $ref: '../_shared/errors.yaml#/components/responses/Conflict' }
        '422': { $ref: '../_shared/errors.yaml#/components/responses/UnprocessableEntity' }
        '503':
          description: |
            `dependency.timeout`, `dependency.fallback_engaged` or `dependency.no_fallback`.
            **Failover is driven by circuit-breaker state, not the monitoring window**
            (`IN-001-D-02`): a 5-minute detection window cannot produce the 2-minute
            failover `M28` `AC-13` requires.
          content:
            application/problem+json:
              schema: { $ref: '../_shared/errors.yaml#/components/schemas/Problem' }
          headers:
            Retry-After: { $ref: '../_shared/components.yaml#/components/headers/RetryAfter' }
          x-retry-safe: true

  /api/v1/payments/confirm:
    post:
      operationId: confirmPayment
      summary: Confirm a payment from a gateway notification
      tags: [payments]
      x-scope: ['payment:write']
      x-scope-status: proposed
      x-owning-module: M20
      x-endpoint-class: write
      x-rate-limit-class: partner-high
      x-wave: W1
      x-retry-safe: false
      x-idempotency-retention: P7D
      x-con03: true
      description: |
        **This is one of the twelve `05-03` §3.2 CON-03 endpoints that NO MODULE
        DECLARES** (`IN-001` §9.2). The W1 portal contract contains a money path with no
        owner on the producing side. It is issued here, assigned to **M20**, so the gap is
        closed rather than carried.

        **`PT-05` — this endpoint receives a HINT, never authority.** A gateway
        notification is never trusted on its own content:

        1. Verify the signature per the rail's scheme (`IN-006` §6).
        2. Deduplicate on the rail's own transaction identifier.
        3. Persist the raw envelope verbatim for audit.
        4. Acknowledge fast, before doing any work.
        5. **Read the authoritative state back from the rail's own query API.**
        6. Apply the state change from *that* read.

        The reason is specific and financial. SSLCOMMERZ's published integration
        requirement is that an IPN — which carries an MD5 `verify_sign` — must be
        re-validated through its Transaction Validation API before the merchant treats a
        payment as complete; a signature check alone is not the sufficient condition.
        bKash's flow is `create → execute → **query**`. Nagad requires RSA signature
        verification against Nagad's public key. **A forged or replayed `payment.received`
        against an endpoint whose URL is discoverable from one prior delivery is a direct
        fraud vector** — `AUDIT-016` `AP-04`, unmitigated at the time of writing. Verified
        2026-08-18.

        On successful confirmation, publishes `payment.received` — which is one of the
        **eight `05-03` §3.3 CON-03 webhooks that no module publishes** (`IN-001` §9.2).
      parameters:
        - $ref: '../_shared/components.yaml#/components/parameters/IdempotencyKeyParam'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [payment_id, rail, rail_transaction_id]
              properties:
                payment_id:          { type: string }
                rail:                { type: string }
                rail_transaction_id: { type: string }
                claimed_amount:
                  $ref: '../_shared/components.yaml#/components/schemas/Money'
                  description: >
                    Advisory only. The authoritative amount is the one returned by the
                    rail's query API in step 5, never this field.
      responses:
        '200':
          description: >
            Confirmed after read-back. Publishes `payment.received` and, where the invoice
            is fully settled, `invoice.paid`.
          headers:
            Idempotency-Replayed: { $ref: '../_shared/components.yaml#/components/headers/IdempotencyReplayed' }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Payment' }
        '202':
          description: >
            Accepted; read-back is in progress. Returned when the rail's query API is slow
            or degraded. The caller polls `job_url` rather than resubmitting.
          content:
            application/json:
              schema: { $ref: '../_shared/components.yaml#/components/schemas/AsyncJobAccepted' }
        '401': { $ref: '../_shared/errors.yaml#/components/responses/Unauthorized' }
        '403': { $ref: '../_shared/errors.yaml#/components/responses/Forbidden' }
        '409': { $ref: '../_shared/errors.yaml#/components/responses/Conflict' }
        '422':
          description: |
            Includes `state.already_in_target` — **treat as success**; it usually means an
            earlier call succeeded and the response was lost. Also
            `idempotency.key_expired`, whose remedy is reconciliation, never resubmission.
          content:
            application/problem+json:
              schema: { $ref: '../_shared/errors.yaml#/components/schemas/Problem' }
          x-retry-safe: false
        '503': { $ref: '../_shared/errors.yaml#/components/responses/ServiceUnavailable' }

components:

  securitySchemes:
    oauthUser:    { $ref: '../_shared/security.yaml#/components/securitySchemes/oauthUser' }
    oauthMachine: { $ref: '../_shared/security.yaml#/components/securitySchemes/oauthMachine' }

  schemas:

    Invoice:
      type: object
      required: [id, state, total, currency_total]
      properties:
        id:    { type: string }
        state: { type: string }
        customer: { $ref: '../_shared/components.yaml#/components/schemas/Reference' }
        issued_at: { type: [string, "null"], format: date-time }
        due_at:    { type: [string, "null"], format: date-time }
        total:          { $ref: '../_shared/components.yaml#/components/schemas/Money' }
        currency_total: { $ref: '../_shared/components.yaml#/components/schemas/Money' }
        paid_total:     { $ref: '../_shared/components.yaml#/components/schemas/Money' }
        vat:
          type: object
          description: >
            Mushak-9.1 fields. The monthly VAT return is filed through the NBR IVAS portal
            at vat.gov.bd by the 15th; verification at 2026-08-18 found no publicly
            documented machine API, so `INT-038` is a P5 batch integration with manual
            portal filing as the standing fallback (`IN-001` §7.2, `IN-004` §7).
          properties:
            bin: { type: [string, "null"] }
            vat_amount: { $ref: '../_shared/components.yaml#/components/schemas/Money' }
        audit: { $ref: '../_shared/components.yaml#/components/schemas/AuditStamp' }

    PaymentInitiation:
      type: object
      required: [payment_id, rail, state]
      properties:
        payment_id: { type: string }
        rail:       { type: string }
        state:      { type: string, enum: [initiated, awaiting_customer, executing] }
        redirect_url: { type: [string, "null"], format: uri }
        rail_token:
          type: [string, "null"]
          description: >
            Opaque. Never logged (`IP-07`, `NFR-062`, `OB-07`). Not persisted beyond the
            transaction's lifetime.
        expires_at: { type: [string, "null"], format: date-time }

    Payment:
      type: object
      required: [payment_id, rail, state, amount]
      properties:
        payment_id: { type: string }
        invoice_id: { type: string }
        rail:       { type: string }
        rail_transaction_id: { type: string }
        state:  { type: string, enum: [initiated, executing, received, failed, reversed, refunded] }
        amount: { $ref: '../_shared/components.yaml#/components/schemas/Money' }
        confirmed_at: { type: [string, "null"], format: date-time }
        read_back_at:
          type: [string, "null"]
          format: date-time
          description: >
            When the authoritative state was read from the rail's query API. **A payment
            with no `read_back_at` has not been confirmed**, regardless of what any
            notification claimed (`PT-05`).
        audit: { $ref: '../_shared/components.yaml#/components/schemas/AuditStamp' }

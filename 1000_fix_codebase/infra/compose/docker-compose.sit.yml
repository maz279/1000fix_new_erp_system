# =============================================================================
# 1000fix-erp - sit environment overlay (PE-002-D-02, infra/environments.yaml)
#
# System integration test environment across real integrated modules.
# Data rule: full TS-002 set, moving; residency_classified: never.
#
# Ports:
#   PostgreSQL: 127.0.0.1:5436
#   Redis:      127.0.0.1:6382
#   Odoo:       127.0.0.1:8072
#
# Up: docker compose -f docker-compose.yml -f docker-compose.sit.yml --profile sit up -d
# =============================================================================
services:
  postgres-sit:
    image: postgres:17.4@sha256:304ab813518754228f9f792f79d6da36359b82d8ecf418096c636725f8c930ad
    profiles: ["sit"]
    environment:
      FIX_ENV: sit
      POSTGRES_USER: fix
      POSTGRES_PASSWORD: ${SIT_DB_PASSWORD:-fix_sit_secret_insecure}
      POSTGRES_DB: fix_sit_moving
      POSTGRES_INITDB_ARGS: "--encoding=UTF8 --locale-provider=icu --icu-locale=en-US"
    ports: ["127.0.0.1:5436:5432"]
    volumes:
      - pgdata-sit:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U fix -d fix_sit_moving"]
      interval: 5s
      timeout: 3s
      retries: 10
    restart: unless-stopped

  redis-sit:
    image: redis:7.2.5@sha256:3aaec283e6e593bde528077d60280ac1589887067a39273348860837c9346d7e
    profiles: ["sit"]
    environment:
      FIX_ENV: sit
    command: ["redis-server", "--save", "", "--appendonly", "no"]
    ports: ["127.0.0.1:6382:6379"]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5
    restart: unless-stopped

  odoo-sit:
    image: 1000fix/odoo:19.0-sit@sha256:bb924ef308fa55ffb6440588b7f5279f682aeab2821a5900699f5190667ccab1   # digest pinned from FIRST BUILD (local registry 127.0.0.1:5500; push to a production registry = operator step per docs/guides/digest-pinning-policy.md)
    # built from the codebase root (infra/docker/odoo/Dockerfile, R01 re-audit)
    build:
      context: ../..
      dockerfile: infra/docker/odoo/Dockerfile
    profiles: ["sit"]
    # server-wide modules (same list as generate-odoo-conf): cd_entity_config
    # carries the RPC error hardening (no tracebacks in JSON-RPC/XML-RPC
    # errors outside dev mode, OWASP A05) and must load before any registry.
    # Arguments starting with '-' are handed to odoo by the image entrypoint.
    command: ["--load=base,rpc,web,cd_entity_config"]
    environment:
      FIX_ENV: sit
      HOST: postgres-sit
      PORT: 5432
      USER: fix
      PASSWORD: ${SIT_DB_PASSWORD:-fix_sit_secret_insecure}
    ports: ["127.0.0.1:8072:8069"]
    volumes:
      - odoo-data-sit:/var/lib/odoo
    depends_on:
      postgres-sit:
        condition: service_healthy
      redis-sit:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://127.0.0.1:8069/web/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

volumes:
  pgdata-sit:
  odoo-data-sit:

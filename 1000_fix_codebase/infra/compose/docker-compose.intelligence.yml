# compose additions for the Wave-8 intelligence platform (P11).
# ClickHouse (warehouse migration), TimescaleDB extension for telemetry.
# Digests resolved at first pull by tooling/scripts/resolve-digests.ps1.
services:
  clickhouse:
    image: clickhouse/clickhouse-server@sha256:bdb5c911a23d92fd364e246ab20b5a0a485f00112f3663fa626b083fb46c146b
    profiles: ["intelligence"]
    environment:
      CLICKHOUSE_DB: fix_analytics
      # Without explicit credentials the image entrypoint DISABLES network
      # access for user 'default' (observed: HTTP 401 from the host), which
      # silently breaks every bi-warehouse tool. Dev-only credentials, in line
      # with the compose env-var rule (never literal secrets).
      CLICKHOUSE_USER: default
      CLICKHOUSE_PASSWORD: ${CLICKHOUSE_PASSWORD:?set CLICKHOUSE_PASSWORD in .env - development-only value}
    ports:
      - "127.0.0.1:8123:8123"
    volumes:
      # DE-05 named volume: warehouse data survives the loss of the container
      - clickhouse-data:/var/lib/clickhouse
    ulimits:
      nofile:
        soft: 262144
        hard: 262144
    restart: unless-stopped

volumes:
  clickhouse-data:

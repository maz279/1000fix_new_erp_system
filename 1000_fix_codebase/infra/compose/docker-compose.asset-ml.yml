# compose additions for the Wave-6 asset-business + ML platform (P09).
# Kafka (event-bus migration), MLflow (model registry), Ollama (LLM).
# Digests resolved at first pull by tooling/scripts/resolve-digests.ps1.
# The asset-ml profile is OPT-IN: `docker compose --profile asset-ml up`.
services:
  kafka-1:
    image: apache/kafka@sha256:PLACEHOLDER-RESOLVE-AT-FIRST-PULL
    profiles: ["asset-ml"]
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENERS: PLAINTEXT://:9092,CONTROLLER://:9093
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka-1:9093
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
    ports:
      - "127.0.0.1:9092:9092"
    restart: unless-stopped

  mlflow:
    image: ghcr.io/mlflow/mlflow@sha256:PLACEHOLDER-RESOLVE-AT-FIRST-PULL
    profiles: ["asset-ml"]
    command: mlflow server --host 0.0.0.0 --port 5000
    ports:
      - "127.0.0.1:5000:5000"
    restart: unless-stopped

  ollama:
    image: ollama/ollama@sha256:PLACEHOLDER-RESOLVE-AT-FIRST-PULL
    profiles: ["asset-ml"]
    ports:
      - "127.0.0.1:11434:11434"
    volumes:
      - ollama-models:/root/.ollama
    restart: unless-stopped

volumes:
  ollama-models:

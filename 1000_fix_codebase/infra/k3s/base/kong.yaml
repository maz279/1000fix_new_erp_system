# Kong 3.9 DB-less - the ONLY backend of the Ingress (every public host).
# The declarative config is RENDERED at pod start by the `render-config`
# initContainer from the single-source template (infra/compose/kong/
# kong.prod.yml + render-kong-config.py, ConfigMap kong-config-template),
# with the host names from ConfigMap fix-platform and the Keycloak realm
# public key from Secret fix-kong-realm-key. Missing/unsafe value -> the
# initContainer exits 1 and Kong never starts (fail closed).
# TLS terminates at the Ingress controller; Kong listens on plain 8000 inside
# the cluster and trusts X-Forwarded-* because the NetworkPolicy admits only
# the ingress controller namespace.
apiVersion: v1
kind: Service
metadata:
  name: kong
  labels: { app.kubernetes.io/name: kong }
spec:
  selector: { app.kubernetes.io/name: kong }
  ports:
    - { name: proxy, port: 80, targetPort: proxy }
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: kong
  labels: { app.kubernetes.io/name: kong, app.kubernetes.io/component: gateway }
spec:
  replicas: 2
  strategy:
    type: RollingUpdate
    rollingUpdate: { maxUnavailable: 0, maxSurge: 1 }
  selector:
    matchLabels: { app.kubernetes.io/name: kong }
  template:
    metadata:
      labels: { app.kubernetes.io/name: kong, app.kubernetes.io/component: gateway }
    spec:
      automountServiceAccountToken: false
      enableServiceLinks: false
      securityContext:
        runAsNonRoot: true
        seccompProfile: { type: RuntimeDefault }
      topologySpreadConstraints:
        - maxSkew: 1
          topologyKey: kubernetes.io/hostname
          whenUnsatisfiable: ScheduleAnyway
          labelSelector:
            matchLabels: { app.kubernetes.io/name: kong }
      initContainers:
        - name: render-config
          image: python:3.12-slim@sha256:cb33f7f771ecec2ef1225cf39b159591a040391bd73e4c01f00fdfc4c47611d2
          command:
            - python
            - -I
            - /opt/kong-render/render-kong-config.py
            - /opt/kong-render/kong.prod.yml
            - /kong/rendered/kong.yml
          envFrom:
            - configMapRef: { name: fix-platform }
          env:
            - name: KEYCLOAK_REALM_PUBLIC_KEY_FILE
              value: /run/secrets/kong-realm-key/public-key
          resources:
            requests: { cpu: 10m, memory: 32Mi }
            limits: { cpu: 200m, memory: 128Mi }
          securityContext:
            runAsUser: 10001
            runAsGroup: 10001
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities: { drop: [ALL] }
          volumeMounts:
            - { name: template, mountPath: /opt/kong-render, readOnly: true }
            - { name: realm-key, mountPath: /run/secrets/kong-realm-key, readOnly: true }
            - { name: rendered, mountPath: /kong/rendered }
      containers:
        - name: kong
          image: kong:3.9@sha256:92035d16d7ff86b7bc12fb1d0090d29357d924238b1880f78735f3f2fea6b631
          env:
            - { name: KONG_DATABASE, value: "off" }
            - { name: KONG_DECLARATIVE_CONFIG, value: /kong/rendered/kong.yml }
            - { name: KONG_PREFIX, value: /kong_prefix }
            - { name: KONG_PROXY_LISTEN, value: "0.0.0.0:8000 reuseport backlog=16384" }
            - { name: KONG_ADMIN_LISTEN, value: "off" }
            - { name: KONG_STATUS_LISTEN, value: "0.0.0.0:8100" }
            - { name: KONG_HEADERS, value: "off" }
            # only the ingress controller can reach :8000 (NetworkPolicy), so the
            # forwarded client IP / proto it sets are trusted
            - { name: KONG_TRUSTED_IPS, value: "0.0.0.0/0,::/0" }
            - { name: KONG_REAL_IP_HEADER, value: X-Forwarded-For }
            - { name: KONG_PROXY_ACCESS_LOG, value: /dev/stdout }
            - { name: KONG_PROXY_ERROR_LOG, value: /dev/stderr }
            - { name: KONG_NGINX_PROXY_CLIENT_MAX_BODY_SIZE, value: 25m }
            - { name: KONG_NGINX_WORKER_PROCESSES, value: "2" }
          ports:
            - { name: proxy, containerPort: 8000 }
            - { name: status, containerPort: 8100 }
          readinessProbe:
            httpGet: { path: /status/ready, port: status }
            periodSeconds: 5
            timeoutSeconds: 3
          livenessProbe:
            httpGet: { path: /status, port: status }
            initialDelaySeconds: 10
            periodSeconds: 10
            timeoutSeconds: 3
            failureThreshold: 6
          resources:
            requests: { cpu: 250m, memory: 512Mi }
            limits: { cpu: "2", memory: 1Gi }
          securityContext:
            runAsUser: 1001
            runAsGroup: 1001
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities: { drop: [ALL] }
          volumeMounts:
            - { name: rendered, mountPath: /kong/rendered, readOnly: true }
            - { name: prefix, mountPath: /kong_prefix }
            - { name: tmp, mountPath: /tmp }
      volumes:
        - name: template
          configMap: { name: kong-config-template }
        - name: realm-key
          secret: { secretName: fix-kong-realm-key }
        - name: rendered
          emptyDir: { medium: Memory, sizeLimit: 8Mi }
        - name: prefix
          emptyDir: { sizeLimit: 256Mi }
        - name: tmp
          emptyDir: { sizeLimit: 256Mi }
---
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: kong
spec:
  minAvailable: 1
  selector:
    matchLabels: { app.kubernetes.io/name: kong }

# portal-vendor (apps/web/vendor) - instance of ../_template.
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
  - ../_template
nameSuffix: -vendor
labels:
  - pairs:
      app.kubernetes.io/name: portal-vendor
    includeSelectors: true
images:
  - name: 1000fix/portal
    newName: 1000fix/portal-vendor

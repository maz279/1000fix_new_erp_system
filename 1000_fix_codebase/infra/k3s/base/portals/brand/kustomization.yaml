# portal-brand (apps/web/brand) - instance of ../_template.
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
  - ../_template
nameSuffix: -brand
labels:
  - pairs:
      app.kubernetes.io/name: portal-brand
    includeSelectors: true
images:
  - name: 1000fix/portal
    newName: 1000fix/portal-brand

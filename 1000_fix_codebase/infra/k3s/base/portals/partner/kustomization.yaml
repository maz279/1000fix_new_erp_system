# portal-partner (apps/web/partner) - instance of ../_template.
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
  - ../_template
nameSuffix: -partner
labels:
  - pairs:
      app.kubernetes.io/name: portal-partner
    includeSelectors: true
images:
  - name: 1000fix/portal
    newName: 1000fix/portal-partner

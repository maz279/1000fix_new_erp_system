# =============================================================================
# 1000fix-erp - tooling/versions.lock
# =============================================================================
# Single source of truth for every pinned tool version and binary digest.
#
# Governance:
#   BE-007 "LX-03" - nothing is installed at "latest"; every version is pinned
#   IR-07          - every dependency pinned to an exact version or digest
#   DE-06          - image tags pinned by digest; ":latest" appears nowhere
#   BE-001 section 4 - toolchain pins consumed by the workstation scripts
#
# FORMAT RULES (both runtimes parse this file - PowerShell and bash):
#   * pin lines are PURE "KEY=VALUE" - NO inline comments after the value
#   * anything after '#' on a pin line is stripped by the parsers, but do not
#     rely on that: keep explanatory text on its own comment line
#   * values may be quoted; both parsers trim double quotes
#
# PLATFORM BASELINE: pure native Windows per programme decision D-WS-001
# (2026-09-30), which supersedes the Ubuntu workstation baseline of IR-002
# P02-M01-T02 / BE-001-D-06 for this build. See
# docs/decisions/D-WS-001-windows-native-workstation-baseline.md
#
# Verification date: 2026-09-30 - every pin checked against upstream sources
# on this date (see docs/traceability/P02-M01.md, "Pin provenance").
# =============================================================================

# -----------------------------------------------------------------------------
# [workstation.windows] - P02-M01 Workstation baseline (native Windows)
# Consumers: setup-workstation.ps1, verify-workstation.ps1,
#            machine-inventory.ps1, install-wkhtmltopdf.ps1
# -----------------------------------------------------------------------------

# --- Operating system floor (T02, Windows adaptation) ------------------------
# Windows 10 22H2 (build 19045) or newer, including Windows 11 (22000+).
# Docker Desktop 4.x requires Windows 10 64-bit 22H2+ at minimum.
# SECURITY NOTE (2026-10): Windows 10 22H2 passed end of support in October
# 2025 (ESU excepted). The FLOOR remains 19045 per D-WS-001, but verify T02
# emits a WARN on Windows 10-range builds - Windows 11 is the target state.
WORKSTATION_WINDOWS_MIN_BUILD=19045

# --- winget-pinned system packages (T04, Windows adaptation) -----------------
# Installed via: winget install --id <id> --version <ver> --exact --silent
#
# PIN SEMANTICS - read before "fixing" a version comparison:
#   The pin is the version setup INSTALLS (exact, via winget --version) and
#   the FLOOR that verify asserts (installed >= pin). Several packages
#   self-update after install (git's updater, Chrome, Firefox) - a machine
#   drifting ABOVE its pin is expected and still compliant. This is floor
#   semantics, not a DE-06 violation: DE-06 governs CONTAINER IMAGE tags
#   (digest-pinned, never ":latest"); workstation packages auto-update by
#   their own updaters and are verified against the floor.
WORKSTATION_WINGET_GIT_ID=Git.Git
# floor 2.40 - BE-004 section 5 (subtrees for 18 OCA repos + partial clone)
WORKSTATION_WINGET_GIT_VERSION=2.55.0.5
WORKSTATION_WINGET_DOCKER_ID=Docker.DockerDesktop
# bundles Docker Engine (>= 24 floor) + Compose v2 + BuildX
WORKSTATION_WINGET_DOCKER_VERSION=4.93.0
WORKSTATION_WINGET_PYTHON_ID=Python.Python.3.12
# exact 3.12.x line - same minor as the Odoo container runtime
WORKSTATION_WINGET_PYTHON_VERSION=3.12.10
WORKSTATION_WINGET_CHROME_ID=Google.Chrome
WORKSTATION_WINGET_CHROME_VERSION=154.0.8037.93
WORKSTATION_WINGET_FIREFOX_ID=Mozilla.Firefox
WORKSTATION_WINGET_FIREFOX_VERSION=157.0

# --- Full-disk encryption (T03, Windows adaptation) --------------------------
# LUKS is Linux-only; the Windows equivalent control is BitLocker on the OS
# volume (same policy driver: DE-12 / SC-009 - no unencrypted workstation).
WORKSTATION_ENCRYPTION_PROVIDER=BitLocker

# --- Docker floors (T06) ------------------------------------------------------
WORKSTATION_DOCKER_ENGINE_MIN_VERSION=24
WORKSTATION_DOCKER_COMPOSE_MIN_MAJOR=2

# --- git floor (T07) ----------------------------------------------------------
WORKSTATION_GIT_MIN_VERSION=2.40

# --- wkhtmltopdf (T08, Windows adaptation - D-WS-001 split-build ruling) -----
# PRIMARY: patched-Qt 0.12.6.1-3 runs INSIDE the Odoo container image
#          (Odoo itself is containerised on Windows; the container is Linux,
#          so the jammy .deb below is the right artefact there).
# HOST:    the last Windows binary upstream ever shipped is 0.12.5-1
#          (msvc2015, win64) - a PATCHED build installed on the host for
#          local QWeb->PDF checks outside the container. Upstream never
#          released a Windows 0.12.6.x and no winget package exists.
WORKSTATION_WKHTMLTOPDF_HOST_VERSION=0.12.5-1
WORKSTATION_WKHTMLTOPDF_HOST_URL=https://github.com/wkhtmltopdf/wkhtmltopdf/releases/download/0.12.5/wkhtmltox-0.12.5-1.msvc2015-win64.exe
WORKSTATION_WKHTMLTOPDF_HOST_SHA256=b5a60b8801a599b9097c5cc8b0d2b18d1709b119b9d88b960f1f38fad498dcd8
WORKSTATION_WKHTMLTOPDF_PATCHED_MARKER=with patched qt
WORKSTATION_WKHTMLTOPDF_CONTAINER_VERSION=0.12.6.1-3
WORKSTATION_WKHTMLTOPDF_CONTAINER_URL_BASE=https://github.com/wkhtmltopdf/packaging/releases/download
WORKSTATION_WKHTMLTOPDF_CONTAINER_SHA256_AMD64=4f723b2691ad8638a9df960e0421d346d7315083e3583a334f33362280ddba15
WORKSTATION_WKHTMLTOPDF_CONTAINER_SHA256_ARM64=2095f20256661ebf0983b9311168596c9d012666e21a94bc24f304db6ac69ec5

# --- Bengali fonts (T05, TR-07 - non-negotiable) -----------------------------
# Primary: Noto Sans Bengali, full hinted family, hash-pinned from the
# upstream notofonts release (installs per-user; no admin required).
# Secondary: Windows ships "Nirmala UI" with full Bengali conjunct support
# as part of the OS - presence verified, nothing downloaded.
# NOTE: the Ubuntu package fonts-lohit-beng-bengali has no Windows
# distribution (upstream publishes font sources only); Nirmala UI fills the
# second-family role. Recorded in D-WS-001 and the traceability matrix.
WORKSTATION_FONT_NOTO_BENGALI_VERSION=NotoSansBengali-v3.011
WORKSTATION_FONT_NOTO_BENGALI_URL=https://github.com/notofonts/bengali/releases/download/NotoSansBengali-v3.011/NotoSansBengali-v3.011.zip
WORKSTATION_FONT_NOTO_BENGALI_SHA256=2aca24bf71665e66c32e14862ee58857dd8b8b07b6321ec7c96f3121ad6683b1
WORKSTATION_FONT_NOTO_BENGALI_FAMILY=Noto Sans Bengali
WORKSTATION_FONT_WINDOWS_BENGALI_FAMILY=Nirmala UI

# --- Host port hygiene (T10 / DE-01) -----------------------------------------
# Nothing but the Docker backend and language toolchains listens on the host.
# These ports must carry no NON-Docker listener at baseline time.
# P07 audit: the core stack now binds 5433/6380/9002 host-side (5432/6379/9000
# are held by a NEIGHBOURING project's Docker stack on this shared workstation —
# Docker listeners, so the no-non-Docker-listener contract still holds for them).
WORKSTATION_RESERVED_PORTS=5432,6379,9000,5433,6380,9002,8025,8100,8110

# --- End of [workstation.windows] --------------------------------------------

# -----------------------------------------------------------------------------
# [app-platform] - P01-M02 technology-decision outputs (2026-10-01)
# Consumers: P02-M02 (toolchain install) onward; verified by the version-
#            currency ritual (tooling/version-currency/verify-version-currency.ps1)
#            at every wave gate. Decisions recorded in docs/decisions/.
# NOTE: container image digests are pinned when the Compose profiles are
#            defined (P02-M05, DE-06); the values below are version baselines.
# -----------------------------------------------------------------------------
APP_PLATFORM_NEXTJS_BASELINE=16.3
APP_PLATFORM_PAYLOAD_BASELINE=3.73
# Node 20 LTS went EOL upstream 2026-04-30 (finding F-1, verification record
# 2026-10-01): the toolchain installs Node 22 LTS (Payload 3.73 requires
# >= 20.9, satisfied). Node 22 EOL 2027-04-30 is a standing watch item.
APP_PLATFORM_NODE_LTS_MAJOR=22
APP_PLATFORM_ODOO_BASELINE=19.0
APP_PLATFORM_POSTGRESQL_MAJOR=17
# Object store selected by D-028; image digest pinned at P02-M05-T02.
APP_PLATFORM_OBJECT_STORE=ceph
# Redis: NO 7.4+/8.x pin until D-031 is taken (licence finding F-2).
APP_PLATFORM_REDIS_PIN_POLICY=7.2.x-or-valkey-pending-D-031
# Mobile framework selected by D-027; React Native must never appear here.
APP_PLATFORM_MOBILE_FRAMEWORK=flutter

# -----------------------------------------------------------------------------
# [toolchain] - P02-M02 (toolchain installation and pinning)
# LOCK RULE (recorded decision): container images pin BYTES (digest, DE-06);
# workstation toolchains pin LINES with floors enforced by doctor.ps1 check 1.
# Rationale: toolchain runtimes self-update within their line via their own
# package managers (nvm/fvm/uv); a stale patch pin is a worse failure mode
# than a line pin with a doctor floor. Exact installed versions are recorded
# back into this file by setup-toolchains.ps1 at bootstrap (provenance).
# -----------------------------------------------------------------------------
TOOLCHAIN_PYTHON=3.12.10
# Node 20 LTS went EOL 2026-04-30 (finding F-1, CR-P01M02-04): line is 22.
TOOLCHAIN_NODE_LTS=22
TOOLCHAIN_PNPM_MAJOR=9
TOOLCHAIN_UV_MAJOR=0.8
# Flutter line 3.44 (D-027): Material/Cupertino extraction + Impeller default -
# read the migration notes BEFORE pinning (roadmap P02-M02-T03 warning).
TOOLCHAIN_FLUTTER_MAJOR=3.44
TOOLCHAIN_GO_MAJOR=1.24
TOOLCHAIN_GIT_MIN=2.40

# -----------------------------------------------------------------------------

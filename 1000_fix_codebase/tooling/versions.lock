# the enumeration is treated as authoritative until BE-004 rules.
VENDOR_OCA_ORG=https://github.com/OCA
VENDOR_OCA_FIELD_SERVICE=PENDING-CLONE
VENDOR_OCA_HELPDESK=PENDING-CLONE
VENDOR_OCA_MANAGEMENT_SYSTEM=PENDING-CLONE
VENDOR_OCA_OPERATING_UNIT=PENDING-CLONE
VENDOR_OCA_HR=PENDING-CLONE
VENDOR_OCA_PAYROLL=PENDING-CLONE
VENDOR_OCA_DMS=PENDING-CLONE
VENDOR_OCA_SERVER_TOOLS=PENDING-CLONE
VENDOR_OCA_WEB=PENDING-CLONE
VENDOR_OCA_ACCOUNT_FINANCIAL_TOOLS=PENDING-CLONE
VENDOR_OCA_ACCOUNT_FINANCIAL_REPORTING=PENDING-CLONE
VENDOR_OCA_REPORTING_ENGINE=PENDING-CLONE
VENDOR_OCA_MIS_BUILDER=PENDING-CLONE
VENDOR_OCA_STOCK_LOGISTICS_WORKFLOW=PENDING-CLONE

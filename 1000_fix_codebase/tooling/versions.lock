# against this file in CI). PIN=PENDING-CLONE until import-vendor.ps1 runs;
# the script writes the resolved commits back into this section.
# -----------------------------------------------------------------------------
VENDOR_ODOO_URL=https://github.com/odoo/odoo
VENDOR_ODOO_BRANCH=19.0
VENDOR_ODOO_COMMIT=643610127254ee77bbc756b6746739e9e9bb85ff
# OCA subtrees - the 20 repositories enumerated by roadmap P02-M04-T03/T04/T05.
# NOTE: the roadmap heading says "18 subtrees" but its own enumeration lists 20

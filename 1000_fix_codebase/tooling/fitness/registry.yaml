    name: state sets registered in DA-009
    blocking: true
    stage: model-registry
    script: check_code_lists.py
    rationale: Wave 1 for exactly this reason - the first module shipping a state field must register it first

  # --- WARNING (3): burn-down targets ---------------------------------------
  - id: FF-13
    name: API response-time budget
    blocking: false
    target: burn to zero by G3
    stage: performance
    script: check_api_budget.py
  - id: FF-14
    name: dependency reciprocity (R-03; extractor)
    blocking: false
    target: 53 known failures burn to zero by G2
    stage: architecture
    script: ../architecture-baseline/extract-dependency-graph.ps1
  - id: FF-27
    name: portal contract test coverage (PS-11)
    blocking: false
    target: rising
    stage: contract
    script: check_portal_contract.py
  - id: FF-38
    name: navigation registry integrity (PP0-M03; counts, ledger, ids, areas, i18n parity, freshness)
    blocking: true
    stage: architecture
    script: check-nav-registry.py
    rationale: contracts/nav/registry.json is the denominator for portal coverage (Gate GP D1) - a drifted or stale registry silently corrupts every downstream count
  - id: FF-39
    name: no fixture/demo data in runtime space + no raw fetch outside api-client (PP1-M04)
    blocking: true
    stage: data
    script: check-no-fixtures.py
    rationale: the data strategy's forbidden class (03-DATA-STRATEGY §1/§3) - one shipped fixture poisons every screen's claim to real data; portals calling services directly breaks P-11
  - id: FF-40
    name: OpenAPI contract surface valid (PP1-M03)
    blocking: true
    stage: contract
    script: check-openapi.py
    rationale: every spec in contracts/openapi must parse, carry info+servers and resolve internal $refs - a spec that fails to parse breaks api-client generation and PS-11 tests silently
  - id: FF-41
    name: Dart offline engine structure (PP4-M01; AR-010 mandates)
    blocking: true
    stage: architecture
    script: check-dart-offline.py
    rationale: the ONE offline engine (FL-03) - if its structure drifts from AR-010 (SP-07 upload-first, DI-05 idempotency, §6 two-state disclosure, SP-09 evidence channel), every mobile app silently loses its offline guarantees
  - id: FF-42
    name: Flutter apps structure (PP4-M02/M03/M04/M05; CFM-01 + FL-03 + DE-17)
    blocking: true
    stage: architecture
    script: check-dart-apps.py
    rationale: all 4 mobile apps must consume fix_ui tokens (no hand hex), the fix_offline engine (never re-implemented), and the customer app must be Bengali-first - a violation here is a silent conformance break


# =============================================================================
# Fitness-function registry - Wave 1 set (P02-M08-T07/T08, AR-012 10)
# Blocking checks live pre-merge from the first Phase 3 commit; Warning checks
# carry burn-down targets; built-but-disabled checks exist so their promotion
# is a flag flip, not a build (FG-04: one wave in reporting mode, then
# blocking).
# Runner: tooling/fitness/run.py (+ run.ps1 Windows entry) - emits RN-01..04
# normalised results (tooling/fitness/result-schema.json).
# =============================================================================
schema: 1000fix-erp/fitness-registry/1
wave: 1

checks:

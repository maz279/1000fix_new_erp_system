    blocking: true
    stage: model-registry
    script: check_ff09_residency.py
    rationale: must exist before the first line of code - a residency leak is a notifiable event
  - id: FF-19
    name: event payload schema conformance
    blocking: true
    stage: event
    script: check_event_schemas.py
  - id: FF-20

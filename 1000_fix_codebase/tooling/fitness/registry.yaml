    blocking: true
    stage: unit
    script: check_demo_data.py
  - id: FF-37
    name: state sets registered in DA-009
    blocking: true
    stage: model-registry
    script: check_code_lists.py
    rationale: Wave 1 for exactly this reason - the first module shipping a state field must register it first
  - id: FF-28
    name: downstream read-only analytics invariant (LB-06 / AR-001)
    blocking: true
    stage: architecture
    script: check-lb06-analytics-readonly.py
    rationale: AR-001 LB-06 - analytics modules must NEVER mutate OLTP operational models or tables

  # --- PROMOTED TO BLOCKING (R09-M04-T03 / FG-04 / Gate G8) ----------------
  - id: FF-13
    name: API response-time budget
    blocking: true
    target: zero latency budget violations (p95 <= 200ms)
    stage: performance
    script: check_api_budget.py
  - id: FF-14
    name: dependency reciprocity (R-03; extractor)
    blocking: true
    target: zero reciprocity failures across module manifests
    stage: architecture
    script: ../architecture-baseline/extract-dependency-graph.ps1
  - id: FF-27
    name: portal contract test coverage (PS-11)
    blocking: true
    target: zero portal contract / view integrity violations
    stage: contract
    script: check_portal_contract.py
  - id: FF-38
    name: navigation registry integrity (PP0-M03; counts, ledger, ids, areas, i18n parity, freshness)
    blocking: true
    stage: architecture
    script: check-nav-registry.py
    rationale: contracts/nav/registry.json is the denominator for portal coverage (Gate GP D1) - a drifted or stale registry silently corrupts every downstream count
  - id: FF-39
    name: no fixture/demo data in runtime space + no raw fetch outside api-client (PP1-M04)
    blocking: true
    stage: data
    script: check-no-fixtures.py
    rationale: the data strategy's forbidden class (03-DATA-STRATEGY §1/§3) - one shipped fixture poisons every screen's claim to real data; portals calling services directly breaks P-11
  - id: FF-40
    name: OpenAPI contract surface valid (PP1-M03)
    blocking: true
    stage: contract
    script: check-openapi.py
    rationale: every spec in contracts/openapi must parse, carry info+servers and resolve internal $refs - a spec that fails to parse breaks api-client generation and PS-11 tests silently
  - id: FF-41
    name: Dart offline engine structure (PP4-M01; AR-010 mandates)
    blocking: true
    stage: architecture
    script: check-dart-offline.py
    rationale: the ONE offline engine (FL-03) - if its structure drifts from AR-010 (SP-07 upload-first, DI-05 idempotency, §6 two-state disclosure, SP-09 evidence channel), every mobile app silently loses its offline guarantees
  - id: FF-42
    name: Flutter apps structure (PP4-M02/M03/M04/M05; CFM-01 + FL-03 + DE-17)
    blocking: true
    stage: architecture
    script: check-dart-apps.py
    rationale: all 4 mobile apps must consume fix_ui tokens (no hand hex), the fix_offline engine (never re-implemented), and the customer app must be Bengali-first - a violation here is a silent conformance break
  - id: FF-43
    name: Next.js portal batch structure (PP5 P01/P05/P06/P07/P08/P10/P12; PP3 template + app-controller parity)
    blocking: true
    stage: architecture
    script: check-portal-batch.py
    rationale: the 7 PP5 portals must keep the PP3 template (P-11 api wrapper, CFM-01 tokens, theme toggles), P01 must stay Bengali-first (DE-17), P06's BI embed must be config-only, P08 must carry brand_id on every call, and every frontend API path must have a registered backend route - a drift here is a silent contract break between portal and Odoo
  - id: FF-44
    name: no fabricated data in the estate (PP6 E3; demo literals + Odoo demo-data policy)
    blocking: true
    stage: data
    script: check-demo-literals.py
    rationale: one shipped sample name or PRNG literal in a view re-poisons the claim that every screen renders real data; Odoo demo data would install fabricated rows on production - the TEST class enters via db/seeds/seed.py only (03-DATA-STRATEGY §1)
  - id: FF-45
    name: data-shape parity + statutory masks (PP6 §4/§7/§8)
    blocking: true
    stage: contract
    script: check-data-parity.py
    rationale: every ported grid must carry the prototype's columns in its API payload (nothing promised silently disappears) and the four statutory identifier masks + bn007 formatter must keep their audit-corrected shapes - drift here is a silent prototype regression or an invented validation rule
  - id: FF-33
    name: performance at 1.5x peak traffic (NFR-081, NFR-092, AR-001 QAS-10)
    blocking: true
    stage: performance
    script: check_perf_peak.py
    rationale: Gate G3 activation - system must sustain 150 req/s with transactional p95 <= 200ms, reporting p95 <= 500ms, and >= 99% correlation-id preservation

  - id: FF-46
    name: clean-install dependency closure (every referenced model reachable via declared depends)
    blocking: true
    stage: architecture
    script: check_manifest_depends.py
    rationale: R01 re-audit 2026-10-22 - an undeclared dependency (cd_gl_ext -> account.fiscal.year) made a fresh install of the first-party estate fail at registry load while incrementally-built databases kept working

  - id: FF-47
    name: record-rule isolation (multi-company + operating-unit ir.rule on every transactional model)
    blocking: true
    stage: architecture
    script: check_isolation_rules.py
    rationale: R01 re-audit 2026-10-22 (pentest A01-05) - 174 transactional models carried company_id/operating_unit_id columns but 167 had no multi-company rule and none an operating-unit rule; the columns isolated nothing


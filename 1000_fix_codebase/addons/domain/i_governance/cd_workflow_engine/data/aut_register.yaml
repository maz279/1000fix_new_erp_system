# AUT register — the 60 business automations (P06-M08-T04; source: 05-05 section 12).
# Every automation has a NAMED execution engine:
#   odoo_automated_action — single-event, single-model (Odoo server action + outbox)
#   airflow              — scheduled / threshold-crossing / time-window workflows
#   domain_service       — a named services/* engine (pricing, dispatch, reconciliation, ML)
# Extracted from the catalogue; assignments reviewed at G3.
automations:
  - id: AUT-001
    trigger: 'Booking received on any channel'
    action: 'Create service order, evaluate entitlement, assign SLA, acknowledge to customer, enter dispatch queue'
    engine: domain_service
  - id: AUT-002
    trigger: 'Order enters dispatch queue'
    action: 'Score candidates; auto-assign above confidence or present ranked list'
    engine: domain_service
  - id: AUT-003
    trigger: 'Technician assigned'
    action: 'Notify technician and customer; publish tracking link; update route'
    engine: domain_service
  - id: AUT-004
    trigger: 'Diagnosis completed'
    action: 'Draft estimate from fault code and standard repair mapping'
    engine: odoo_automated_action
  - id: AUT-005
    trigger: 'Estimate issued'
    action: 'Send on preferred channels; start expiry timer; remind at 24h and 48h; expire on limit'
    engine: odoo_automated_action
  - id: AUT-006
    trigger: 'Customer approves'
    action: 'Reserve parts, release work order, notify technician'
    engine: odoo_automated_action
  - id: AUT-007
    trigger: 'Parts unavailable'
    action: 'Search network; recommend source; raise transfer or purchase; hold job; inform customer with revised ETA'
    engine: odoo_automated_action
  - id: AUT-008
    trigger: 'QC passed'
    action: 'Generate service report, raise invoice, notify customer as Ready'
    engine: odoo_automated_action
  - id: AUT-009
    trigger: 'SLA at 50/75/90/100%'
    action: 'Escalate to defined roles with acknowledgement tracking'
    engine: airflow
  - id: AUT-010
    trigger: 'Job completed'
    action: 'Trigger CSAT survey after the configured delay'
    engine: odoo_automated_action
  - id: AUT-011
    trigger: 'Same device + fault within 30 days'
    action: 'Flag rework, link records, notify quality and the original technician''s manager'
    engine: odoo_automated_action
  - id: AUT-012
    trigger: 'Device ready and uncollected'
    action: 'Reminder sequence at 3, 7, 15 and 30 days; then abandonment process'
    engine: airflow
  - id: AUT-013
    trigger: 'Nightly 05:00'
    action: 'Optimise all routes for the next day; publish; notify technicians'
    engine: airflow
  - id: AUT-014
    trigger: 'Technician syncs offline work'
    action: 'Reconcile parts, time and evidence; release downstream actions'
    engine: domain_service
  - id: AUT-015
    trigger: 'Contract expiry − 90/60/30/15 days'
    action: 'Notify customer and account owner; generate renewal quotation at 60 days'
    engine: airflow
  - id: AUT-016
    trigger: 'Contract activated'
    action: 'Generate the full preventive-maintenance schedule for the term'
    engine: odoo_automated_action
  - id: AUT-017
    trigger: 'Preventive visit due − lead time'
    action: 'Create the work order and enter the dispatch queue'
    engine: airflow
  - id: AUT-018
    trigger: 'Warranty job closed'
    action: 'Create claim, assemble evidence pack, validate completeness, queue for submission'
    engine: odoo_automated_action
  - id: AUT-019
    trigger: 'Claim validated'
    action: 'Submit to the brand in their required format'
    engine: odoo_automated_action
  - id: AUT-020
    trigger: 'Brand response received'
    action: 'Update claim; on approval queue for billing; on rejection open a dispute task'
    engine: odoo_automated_action
  - id: AUT-021
    trigger: 'Brand remittance received'
    action: 'Match to claims; post to ledger; flag unmatched'
    engine: domain_service
  - id: AUT-022
    trigger: 'Invoice issued'
    action: 'Deliver on preferred channels with payment link'
    engine: odoo_automated_action
  - id: AUT-023
    trigger: 'Invoice unpaid at 7/14/21/30 days'
    action: 'Execute the dunning sequence; at 30 days enter the collections queue'
    engine: airflow
  - id: AUT-024
    trigger: 'Payment received'
    action: 'Match to invoice; mark paid; post to ledger; receipt to customer'
    engine: domain_service
  - id: AUT-025
    trigger: 'Subscription cycle due'
    action: 'Generate the invoice with proration and usage'
    engine: airflow
  - id: AUT-026
    trigger: 'Marketplace job completed and hold period elapsed'
    action: 'Accrue commission; add to the next payout run'
    engine: airflow
  - id: AUT-027
    trigger: 'Payout run scheduled'
    action: 'Calculate, produce statements, generate the disbursement file, request approval'
    engine: odoo_automated_action
  - id: AUT-028
    trigger: 'Refund approved'
    action: 'Execute through the original method; post; notify customer'
    engine: odoo_automated_action
  - id: AUT-029
    trigger: 'Customer registers'
    action: 'Award registration points; send welcome journey; set preferences'
    engine: odoo_automated_action
  - id: AUT-030
    trigger: 'Referral converts'
    action: 'Credit both parties; notify; accrue partner commission'
    engine: odoo_automated_action
  - id: AUT-031
    trigger: 'Stock reaches reorder point'
    action: 'Alert; draft purchase requisition with recommended quantity'
    engine: airflow
  - id: AUT-032
    trigger: 'Requisition approved'
    action: 'Generate and transmit the purchase order; track acknowledgement'
    engine: odoo_automated_action
  - id: AUT-033
    trigger: 'Goods received and inspected'
    action: 'Update stock; allocate landed cost; trigger three-way match'
    engine: domain_service
  - id: AUT-034
    trigger: 'Three-way match successful'
    action: 'Route the vendor invoice to the payment schedule'
    engine: domain_service
  - id: AUT-035
    trigger: 'Technician shift ends'
    action: 'Reconcile van stock; report variance to branch manager'
    engine: domain_service
  - id: AUT-036
    trigger: 'Cycle count due'
    action: 'Generate the count task list by ABC class and location'
    engine: airflow
  - id: AUT-037
    trigger: 'Dead stock threshold reached'
    action: 'Produce a disposition recommendation'
    engine: airflow
  - id: AUT-038
    trigger: 'Asset telemetry breaches threshold'
    action: 'Raise an alert; correlate; open a ticket if the rule requires'
    engine: odoo_automated_action
  - id: AUT-039
    trigger: 'Predicted failure above confidence'
    action: 'Notify account manager; propose a proactive service booking'
    engine: odoo_automated_action
  - id: AUT-040
    trigger: 'E-waste item triaged for recycling'
    action: 'Verify a destruction certificate exists; batch for transfer'
    engine: odoo_automated_action
  - id: AUT-041
    trigger: 'Certification expiry − 90/60/30/15 days'
    action: 'Notify technician, manager and HR; schedule re-certification'
    engine: airflow
  - id: AUT-042
    trigger: 'Certification expires'
    action: 'Remove the technician from that brand''s warranty dispatch pool'
    engine: domain_service
  - id: AUT-043
    trigger: 'Month end'
    action: 'Run close checklist, accruals, prepayment amortisation, FX revaluation, recurring journals'
    engine: odoo_automated_action
  - id: AUT-044
    trigger: 'Bank statement imported'
    action: 'Auto-match; present only exceptions'
    engine: domain_service
  - id: AUT-045
    trigger: 'Payroll period locked'
    action: 'Calculate payroll, incentives and tax; present for approval'
    engine: odoo_automated_action
  - id: AUT-046
    trigger: 'Payroll approved'
    action: 'Generate the BEFTN file, distribute payslips, post to ledger'
    engine: odoo_automated_action
  - id: AUT-047
    trigger: 'Employee joins'
    action: 'Create identity, assign role from position profile, grant portal access, assign onboarding and mandatory training'
    engine: odoo_automated_action
  - id: AUT-048
    trigger: 'Employee leaves'
    action: 'Revoke all access within one hour; deregister devices; reassign delegated authority; trigger clearance'
    engine: odoo_automated_action
  - id: AUT-049
    trigger: 'Quality event (rework, failed QC, complaint)'
    action: 'Raise a non-conformance; route to the process owner'
    engine: domain_service
  - id: AUT-050
    trigger: 'CAPA due date + verification interval'
    action: 'Prompt effectiveness verification; reopen if not verified'
    engine: airflow
  - id: AUT-051
    trigger: 'Document reaches end of retention'
    action: 'Present for disposal review unless under legal hold'
    engine: odoo_automated_action
  - id: AUT-052
    trigger: 'Access certification cycle due'
    action: 'Issue review tasks to all managers; revoke unconfirmed access at the deadline'
    engine: airflow
  - id: AUT-053
    trigger: 'Integration error rate above threshold'
    action: 'Alert the owner; open the circuit breaker; activate the documented fallback'
    engine: odoo_automated_action
  - id: AUT-054
    trigger: 'Event in dead letter > 1 hour'
    action: 'Alert; create a triage task'
    engine: odoo_automated_action
  - id: AUT-055
    trigger: 'Backup completes'
    action: 'Verify integrity; report; alert on failure'
    engine: odoo_automated_action
  - id: AUT-056
    trigger: 'Scheduled restore test due'
    action: 'Execute; verify; record evidence'
    engine: airflow
  - id: AUT-057
    trigger: 'Model drift detected'
    action: 'Alert the model owner; schedule retraining; continue with the current model'
    engine: odoo_automated_action
  - id: AUT-058
    trigger: 'Security anomaly detected'
    action: 'Alert; if severity warrants, suspend the session and require re-authentication'
    engine: odoo_automated_action
  - id: AUT-059
    trigger: 'Data quality test fails'
    action: 'Block the dependent dashboard refresh; alert the data owner'
    engine: odoo_automated_action
  - id: AUT-060
    trigger: 'Certificate or credential expiry − 30 days'
    action: 'Alert the owner; create a rotation task'
    engine: airflow

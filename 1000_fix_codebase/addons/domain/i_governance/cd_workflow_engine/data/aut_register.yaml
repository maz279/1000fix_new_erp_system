# AUT register — the 60 business automations (P06-M08-T04; source: 05-05 section 12).
#
# 19.0.1.2.0 (A4-F01): this file no longer CLAIMS engines, it names the
# mechanism that really executes each row on this estate, in a form Odoo
# verifies at runtime (models/fix_workflow_engine.py::_binding_resolver):
#   odoo_cron       cron:<module>.<xmlid>     an ir.cron scheduled action
#   odoo_method     method:<model>.<method>   a model method on a document step
#   event_consumer  consumer:<event_type>     an outbox event -> consumer
#   manual          (no reference)            nothing executes the row
# `implementation` is the honest verdict on how much of the described
# behaviour the executor performs (full 20 / partial 32 / none 8 at issue);
# `executor_note` says where the code lives and what is missing. Rows with
# implementation 'none' are loaded inactive: an automation nobody runs
# automates nothing. trigger/action/fallback text is the catalogue's own and
# is never rewritten by the loader.
automations:
  - id: AUT-001
    trigger: 'Booking received on any channel'
    action: 'Create service order, evaluate entitlement, assign SLA, acknowledge to customer, enter dispatch queue'
    engine: odoo_method
    engine_ref: 'method:fix.walkin.intake.action_complete_handover'
    implementation: partial
    executor_note: 'cd_front_desk/models/fix_walkin_intake.py:510,541 — the walk-in handover creates the service order (entitlement and SLA come with the order''s own create); the customer ack is the service_order.intake consumer (cd_contact_centre/models/fix_a02_notifications.py:109). Walk-in channel only: no omnichannel booking intake function exists.'
    fallback: 'Front-desk agent books the order by hand and confirms to the customer'
  - id: AUT-002
    trigger: 'Order enters dispatch queue'
    action: 'Score candidates; auto-assign above confidence or present ranked list'
    engine: odoo_method
    engine_ref: 'method:fix.field.order.action_suggest_technicians'
    implementation: partial
    executor_note: 'cd_field_service/models/fix_field_order.py:2159 — the deterministic scoring engine presents a ranked list with reasons ("the dispatcher decides, the model only recommends"); dispatching is action_dispatch (:986), a dispatcher-gated human step. No auto-assign above a confidence threshold exists.'
    fallback: 'Dispatcher assigns from the ranked list by hand'
  - id: AUT-003
    trigger: 'Technician assigned'
    action: 'Notify technician and customer; publish tracking link; update route'
    engine: manual
    engine_ref: ''
    implementation: none
    executor_note: 'Nothing in the estate publishes a customer tracking link (A4 §3 AUT-003); assignment notification exists only as the field-order acceptance path, not this automation.'
    fallback: 'Call centre informs the customer of the technician and the window'
  - id: AUT-004
    trigger: 'Diagnosis completed'
    action: 'Draft estimate from fault code and standard repair mapping'
    engine: manual
    engine_ref: ''
    implementation: none
    executor_note: 'No automatic estimate drafting from fault code; only per-fault estimate tracking exists (cd_service_order/models/fix_service_order_fault.py:59).'
    fallback: 'Technician drafts the estimate from the diagnosis'
  - id: AUT-005

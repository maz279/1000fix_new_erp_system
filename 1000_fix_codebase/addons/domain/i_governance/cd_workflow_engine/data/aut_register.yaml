    engine: odoo_cron
    engine_ref: 'cron:cd_service_order.ir_cron_estimate_expiry'
    implementation: partial
    executor_note: 'cd_service_order ir_cron_estimate_expiry expires estimates past their validity; the send is the estimate.sent consumer (fix.notif.delivery). The 24h/48h reminders do not exist.'
    fallback: 'Service adviser phones the customer before the estimate lapses'
  - id: AUT-006

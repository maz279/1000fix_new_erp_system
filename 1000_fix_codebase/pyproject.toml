[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "1000fix-erp"
version = "0.1.0"
description = "1000 FiX Services Ltd. - Integrated Smart Enterprise Platform"
requires-python = ">=3.12"
dependencies = [
    "pytest>=8.0.0",
    "pytest-cov>=5.0.0",
    "coverage>=7.5.0",
]

# The repository is an application (Odoo addons + services), not a
# distributable package: uv installs the dependencies and builds nothing.
# Without this, `uv sync` asks hatchling to build a wheel and fails
# ("Unable to determine which files to ship") - the CI precommit job did.
[tool.uv]
package = false

# Tools the CI pipeline runs through `uv run` (precommit, lint-type,
# security stages). uv installs the dev group by default on `uv sync`.
# ruff matches the .pre-commit-config.yaml pin.
[dependency-groups]
dev = [
    "pre-commit>=4.0",
    "ruff==0.8.4",
    "mypy>=1.13",
    "pip-audit>=2.7",
]

# =============================================================================
# Root Python configuration - P02-M08-T02/T03 (BE-002 4.1-4.6)
# Ruff (format + lint, PYS-01) and mypy --strict (PYS-07/10/11) for everything;
# pylint-odoo adds the Odoo defect classes over addons/ (SQL-02, XS-08).
# Editor behaviour mirrors this (.vscode/settings.json) - or the two disagree
# daily.
# =============================================================================

[tool.ruff]
line-length = 100
target-version = "py312"
exclude = ["vendor/**", "infra/odoo-data/**"]

[tool.ruff.lint]
select = [
    "E", "W",   # pycodestyle
    "F",        # pyflakes
]
ignore = [
    "E501",     # formatter owns line length
    "E402",     # module level import not at top
    "E741",     # ambiguous variable name
    "E722",     # bare except
    "W291",     # trailing whitespace
    "W292",     # no newline at end of file
    "W293",     # blank line contains whitespace
    "F401",     # imported but unused
    "F841",     # unused local variable
]


[tool.ruff.lint.per-file-ignores]
"db/seeds/**" = ["S311"]   # deterministic random is the point (fixed seed)
"tooling/**" = ["S603", "S607", "S101", "S108", "S310", "S110", "S608", "C414", "UP031", "E501"]
"tests/**" = ["S101", "S603", "S607"]



[tool.mypy]
python_version = "3.12"
strict = true                       # PYS-07/10/11
warn_unused_ignores = true
warn_redundant_casts = true
disallow_untyped_decorators = false  # Odoo decorators are untyped upstream
exclude = "vendor/"
# Odoo's ORM is untyped upstream; strictness holds on OUR code, with a
# per-file opt-out that must carry a TODO(DBT-nnn) - review-only rule PYS-22
# pattern applies.

[[tool.mypy.overrides]]
module = ["odoo.*", "odoo.addons.*"]
ignore_missing_imports = true

[tool.pylint.messages_control]
# pylint-odoo profile over addons/ (P02-M08-T03). Odoo-specific plugins:
# odoolint (manifest-completeness, translation-required, sql-injection,
# compute-method correctness).
disable = ["all"]
enable = [
    "odoolint",           # the OCA plugin set
]

[tool.pylint.master]
load-plugins = ["pylint_odoo"]
ignore-paths = ["^vendor/"]

[tool.pytest.ini_options]
testpaths = ["addons", "services", "libs"]
addopts = "--import-mode=importlib -q"
# R01-M02-T03: --import-mode=importlib enables pytest services to collect all 202+
# tests without manual flags; addons/conftest.py provides aliases for all cd_*
# modules across relative dotted paths so odoo metaclass checks succeed.
markers = [
    "financial: 100% coverage mandatory (DoD-03)",
    "tax: 100% coverage mandatory (DoD-03) - Mushak paths",
    "residency: touches residency-classified fields (FF-09 review)",
]

[tool.coverage.run]
branch = true
source = ["addons", "services", "libs"]
omit = [
    "*/tests/*",
    "*/test_*",
    "vendor/*",
    "infra/*",
    "tooling/*",
    "db/*",
]

[tool.coverage.report]
show_missing = true
precision = 2
exclude_lines = [
    "pragma: no cover",
    "def __repr__",
    "if False:",
    "if __name__ == .__main__.:",
    "raise NotImplementedError",
    "if TYPE_CHECKING:",
]
